id: decisions
schema_version: 1
version: 0.1
depends:
  - project
updated: 2026-11-15
attachment:
  - "PROJECT/decisions.md — the decision ledger: ADR-lite entries (context / decision / consequence), appended at the bottom, never rewritten"
fields: {}
inject: "Decisions ledger `PROJECT/decisions.md`: ADR-lite entries (`D-<n> YYYY-MM-DD` + context/decision/consequence), append at bottom, never rewrite; the native tracker owns tasks, this owns reasons; details PLUGIN.md"
usage:
  - Appending (manual, semantic): a decision is written when it is made — entry number continues the ledger (D-1, D-2, …), superseding is recorded as a new entry referencing the old one, never an edit
  - High-value conclusions from develop sessions distill here (the develop bridge's landing site), each entry carrying a one-line back-reference to the triggering journal entry
checks:
  - Entries without a `D-<n> YYYY-MM-DD` heading (attached audit `check/scripts/check.py`) → error
  - Historical entries modified (verifiable via git) → error (semantic item, check command)
