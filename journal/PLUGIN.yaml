id: journal
schema_version: 1
version: 0.1
depends:
  - project
updated: 2026-11-15
attachment:
  - "PROJECT/journal.md — single-file run journal (rolling window)"
  - "PROJECT/archive/<YYYY-MM>/journal.md — archive spillover (immutable zone, grouped by entry month)"
fields: {}
usage_routes:
  - owfa-develop
inject: "Journal `PROJECT/journal.md`: prepend, never rewrite; entry = date + type (map/save/check/plugin/develop/other) + one sentence via `pipeline.py journal`; >100 auto-archived to `PROJECT/archive/<m>/`; details PLUGIN.md"
usage:
  - Writing lines (mechanical, automatic): `python .owfa/plugins/domains/project/pipeline.py journal <type> "<one sentence>"` (type value set in the journal block of the AGENTS injection region); rolling window and archiving are performed by the script
  - Freshness read: agents entering the workspace read the journal tail window (plus `git log --oneline`) before acting — the hot slot's project form
checks:
  - Undated or off-enum entries (attached audit `check/scripts/check.py`, main file and archive checked alike) → error
  - Capacity over 100 entries → re-check after mechanical archiving; historical entries modified (verifiable via git) → error (semantic items)
