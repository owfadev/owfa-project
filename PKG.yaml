schema_version: 1
id: project
kind: protocol
protocol: project
version: 0.4
# floor raised from >= 0.4.5: 0.4.6 guarantees the ABI-validation kernel machinery
compat: ">= 0.4.6"
abi:
  # abi-spec v2 §5 — the ABI access face this package ships (docs/abi.md has the full rules)
  semantics: [list, get, search, recent]
  search_lang: "case-insensitive substring match over entry title + body (decisions and journal entries)"
  addr_doc: docs/abi.md
members: [project, decisions, journal, index, check]
provides: [project.org.v1]
skeleton: [PROJECT/]
uninstall:
  # anchors = the append-only ledgers, the human-owned trace (M2: derived pages carry no anchor)
  anchors: [PROJECT/decisions.md, PROJECT/journal.md]
  # Plain statement: today nothing under PROJECT/ is swept on uninstall (retains = [PROJECT/]).
  # A packages/ machine-zone sweep is future kernel-home work; until that lands, retains stays [PROJECT/].
  retains: [PROJECT/]
  credentials: []
  bridges: []
  processes: []
disclosure: "Purely local project-workspace organization (PROJECT/ ledger pages, derived index, protocol check, dev-loop command); no network services, no credentials; the protocol never modifies project code and touches nothing outside PROJECT/."
